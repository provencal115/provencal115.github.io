<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Isaac Provencal</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f3f1ec;
      color: #1c1b19;
      font-family: "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111210; color: #f4f2ec; }
    }
    main { max-width: 36rem; }
    h1 {
      margin: 0 0 0.75rem;
      font-family: Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.4rem, 6vw, 3.5rem);
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 1.5rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>This page does not exist.</h1>
    <p>The address may be mistyped, or the page may have moved.</p>
    <p><a id="home" href="./">Back to the portfolio</a></p>
  </main>
  <script>
    (function () {
      var link = document.getElementById("home");
      var path = window.location.pathname.replace(/\/+$/, "");
      var slash = path.lastIndexOf("/");
      link.setAttribute("href", slash <= 0 ? "/" : path.slice(0, slash + 1));
    })();
  </script>
</body>
</html>
